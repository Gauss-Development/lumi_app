name: Flutter CI

on:
  push:
    branches:
      - main
      - cursor/**
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web development entrypoint
        run: flutter build web --target lib/main_development.dart

      - name: Build web production entrypoint
        run: flutter build web --target lib/main_production.dart
